# ══════════════════════════════════════════════════════════════════════════════
# ArmPilot-AI — Production Docker Compose
# ══════════════════════════════════════════════════════════════════════════════

services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    container_name: armpilot-backend-prod
    ports:
      - "8000:8000"
    volumes:
      - ../models:/app/models
      - ../data:/app/data
      - ../reports:/app/reports
    env_file:
      - ../.env
    environment:
      - ARMPILOT_DEBUG=false
      - ARMPILOT_LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    restart: always

  nginx:
    image: nginx:alpine
    container_name: armpilot-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 256M
    restart: always
