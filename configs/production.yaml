# ArmPilot-AI — Production Environment Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false
  reload: false
  log_level: WARNING

inference:
  runtime: llama.cpp
  default_threads: 8
  default_batch_size: 512
  default_context_length: 2048
  gpu_layers: 0

benchmark:
  duration_seconds: 120
  num_requests: 50
  warmup_requests: 5
  concurrency: 4

optimization:
  max_candidates: 8
  benchmark_per_candidate: 10

auth:
  jwt_secret_key: ${ARMPILOT_JWT_SECRET_KEY}
  jwt_access_token_expire_minutes: 60
  jwt_refresh_token_expire_days: 30

storage:
  data_dir: /var/lib/armpilot/data
  models_dir: /var/lib/armpilot/models
  reports_dir: /var/lib/armpilot/reports

logging:
  level: WARNING
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: /var/log/armpilot/app.log
  rotation: 50 MB
  retention: 30 days

cors:
  origins:
    - https://app.armpilot.ai
    - https://armpilot.ai

features:
  auto_load_model: false
  telemetry_enabled: true
  profiling_enabled: false

rate_limiting:
  enabled: true
  requests_per_minute: 60
  burst: 10

health_check:
  enabled: true
  interval_seconds: 30
