# ArmPilot-AI — Development Environment Configuration

server:
  host: 127.0.0.1
  port: 8000
  debug: true
  reload: true
  log_level: DEBUG

inference:
  runtime: llama.cpp
  default_threads: 2
  default_batch_size: 256
  default_context_length: 1024
  gpu_layers: 0

benchmark:
  duration_seconds: 10
  num_requests: 3
  warmup_requests: 1
  concurrency: 1

optimization:
  max_candidates: 3
  benchmark_per_candidate: 2

auth:
  jwt_secret_key: dev-secret-do-not-use-in-production
  jwt_access_token_expire_minutes: 1440
  jwt_refresh_token_expire_days: 90

storage:
  data_dir: data/dev
  models_dir: models
  reports_dir: reports/dev

logging:
  level: DEBUG
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: logs/dev.log
  rotation: 10 MB
  retention: 3 days

cors:
  origins:
    - http://localhost:3000
    - http://localhost:5173
    - http://localhost:8080

features:
  auto_load_model: false
  telemetry_enabled: false
  profiling_enabled: true
